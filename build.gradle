plugins {
  id 'java'
  id 'maven-publish'
  id 'jacoco'
}

description = 'Grengine is an engine for running and embedding Groovy in a Java VM.'

version = '4.1.2-SNAPSHOT'

ext {
    javaVersion='17'
    groovyVersion='6.0.0' // JDK 17+
    junitVersion='6.1.3'
    hamcrestVersion='3.0'
    commonsIoVersion='2.22.0'
}

java {
  toolchain {
    languageVersion = JavaLanguageVersion.of(javaVersion)
    vendor = JvmVendorSpec.AZUL // Zulu
    implementation = JvmImplementation.VENDOR_SPECIFIC
  }
  withSourcesJar()
  withJavadocJar()
}

jar {
  manifest {
    attributes 'Implementation-Title': 'grengine', 'Implementation-Version': version, 'provider': 'gradle'
  }
}

dependencies {
  compileOnly "org.apache.groovy:groovy:$groovyVersion"

  testImplementation "org.apache.groovy:groovy:$groovyVersion"
  testRuntimeOnly "org.apache.groovy:groovy-grape-ivy:$groovyVersion"
  // testRuntimeOnly "org.apache.groovy:groovy-grape-maven:$groovyVersion"

  testImplementation platform("org.junit:junit-bom:$junitVersion")
  testImplementation 'org.junit.jupiter:junit-jupiter'
  testRuntimeOnly 'org.junit.platform:junit-platform-launcher'

  testImplementation "org.hamcrest:hamcrest:$hamcrestVersion"
  testImplementation "commons-io:commons-io:$commonsIoVersion"
}

project.group = 'ch.grengine'

repositories {
  mavenCentral()
}

// fetching element-list files for Groovy Javadoc links from the Groovy JAR
// from Maven Central, because the Groovy site was often unresponsive
configurations {
  groovyJavadoc
}
dependencies {
  groovyJavadoc "org.apache.groovy:groovy:$groovyVersion:javadoc@jar"
}
def groovyElementListDir = layout.buildDirectory.dir('tmp/groovyElementList')
tasks.register('extractGroovyElementList', Copy) {
  from({ zipTree(configurations.groovyJavadoc.singleFile) })
  include 'element-list'
  into groovyElementListDir
}

javadoc {
  dependsOn(extractGroovyElementList)
  configure(options) {
    windowTitle = "Grengine - $project.version"
    header = 'Grengine'
    author = true
    links = ['https://docs.oracle.com/en/java/javase/' + javaVersion + '/docs/api/']
    linksOffline('https://docs.groovy-lang.org/' + groovyVersion + '/html/api/',
      groovyElementListDir.get().asFile.path)
    tags = ['grengine.scriptthrows:a:Throws (out of Groovy script):']
  }
  // treat Javadoc warnings as errors
  options.addBooleanOption('Werror', true)
}

tasks.withType(JavaCompile).configureEach {
  // treat Java compiler warnings as errors
  options.compilerArgs << "-Xlint:all" << "-Werror"
}

test {
  testLogging.showStandardStreams = true
  useJUnitPlatform()
  finalizedBy(jacocoTestReport)
}

jacocoTestReport {
  dependsOn(test)
}

publishing {
  publications {
      create('mavenJava', MavenPublication) {
      from components.java
      pom {
        name = 'grengine'
        description = project.description
        url = 'https://grengine.ch/'
        licenses {
          license {
            name = 'The Apache Software License, Version 2.0'
            url = 'https://www.apache.org/licenses/LICENSE-2.0'
            distribution = 'repo'
          }
        }
        scm {
          url = 'https://github.com/alainstalder/grengine'
          connection = 'https://github.com/alainstalder/grengine.git'
          developerConnection = 'https://github.com/alainstalder/grengine.git'
        }
        developers {
          developer {
            id = 'alainstalder'
            name = 'Alain Stalder'
            email = 'astalder@xphi.ch'
          }
        }
      }
    }
  }

  repositories {
    mavenLocal()
  }
}

tasks.register('copyMetadataModuleToLibs', Copy) {
  dependsOn(generateMetadataFileForMavenJavaPublication)
  dependsOn(generatePomFileForMavenJavaPublication)
  dependsOn(publishMavenJavaPublicationToMavenLocal)
  from layout.buildDirectory.dir('publications/mavenJava')
  into layout.buildDirectory.dir('libs')
  include 'module.json'
  rename 'module.json', "${project.name}-${project.version}.module"
}

tasks.register('copyPomToLibs', Copy) {
  dependsOn(generateMetadataFileForMavenJavaPublication)
  dependsOn(generatePomFileForMavenJavaPublication)
  dependsOn(publishMavenJavaPublicationToMavenLocal)
  from layout.buildDirectory.dir('publications/mavenJava')
  into layout.buildDirectory.dir('libs')
  include 'pom-default.xml'
  rename 'pom-default.xml', "${project.name}-${project.version}.pom"
}

tasks.register('copyJarsAndMetadataModuleAndPomToReleases', Copy) {
  dependsOn(jar)
  dependsOn(sourcesJar)
  dependsOn(javadocJar)
  dependsOn(copyMetadataModuleToLibs)
  dependsOn(copyPomToLibs)
  from layout.buildDirectory.dir('libs')
  into layout.buildDirectory.dir("releases/${project.version}")
  include '*.jar'
  include '*.pom'
  include '*.module'
}

tasks.register('copyJavadocToReleases', Copy) {
  dependsOn(javadoc)
  from layout.buildDirectory.dir('docs/javadoc')
  into layout.buildDirectory.dir("releases/${project.version}/javadoc")
  include '**/*'
}

tasks.register('copyJacocoToReleases', Copy) {
  dependsOn(jacocoTestReport)
  from layout.buildDirectory.dir('reports/jacoco/test/html')
  into layout.buildDirectory.dir("releases/${project.version}/jacoco")
  include '**/*'
}

tasks.register('all') {
  dependsOn(copyJarsAndMetadataModuleAndPomToReleases)
  dependsOn(copyJavadocToReleases)
  dependsOn(copyJacocoToReleases)
  dependsOn(publishToMavenLocal)
}
